name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check scripts

      - name: Bandit (security scan)
        run: bandit -q -r scripts -c pyproject.toml

      - name: Python compile check
        run: |
          python - <<'PY'
          import pathlib, py_compile
          for p in pathlib.Path('scripts').rglob('*.py'):
              py_compile.compile(str(p), doraise=True)
          print('py_compile: OK')
          PY

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck -S error scripts/*.sh ultrawork_verification.sh

      - name: Phase 5 automation smoke
        run: |
          python scripts/extract_facts_from_markdown.py
          python scripts/source_confidence.py
          python scripts/audit_fact_conflicts.py
          python scripts/render_pages_from_facts.py
          python scripts/auto_collect_official_platforms.py
          python scripts/auto_collect_awards_official.py
          python scripts/auto_collect_brands.py
          python scripts/auto_detect_future_works.py

      - name: Pytest
        run: pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the standalone dashboard
        run: |
          docker build -t wiki-ci .
          docker run -d --name wiki-ci -p 127.0.0.1:8000:8000 wiki-ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/api/status
          docker exec wiki-ci test ! -d /app/.git
      - name: Container logs
        if: always()
        run: docker logs wiki-ci || true
