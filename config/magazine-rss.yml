# Verified official magazine search endpoints and RSS feeds
# 목적: 매체가 실제 제공하는 검색 API 또는 RSS로 수집합니다.
# 원칙: 링크만 수집(원문 복사 금지)
# keyword_search: 검색 결과 첫 페이지. recent_feed: 최신 RSS에 포함된 기사만.
# 2026-10-18 각 사이트 검색 화면의 공개 요청과 실제 응답으로 검증.

keyword: "고윤정"
feeds:
  - name: "ELLE Korea"
    url: "https://www.elle.co.kr/search"
    mode: "hll_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "W Korea"
    url: "https://www.wkorea.com/wp-admin/admin-ajax.php"
    mode: "wp_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Harper’s BAZAAR Korea"
    url: "https://www.harpersbazaar.co.kr/search"
    mode: "hll_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "GQ Korea"
    url: "https://www.gqkorea.co.kr/wp-admin/admin-ajax.php"
    mode: "wp_search"
    scope: "keyword_search"
    type_hint: "interview"
  - name: "Vogue Korea"
    url: "https://www.vogue.co.kr/feed/?s=%EA%B3%A0%EC%9C%A4%EC%A0%95"
    mode: "rss"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Marie Claire Korea"
    url: "https://www.marieclairekorea.com/?s=%EA%B3%A0%EC%9C%A4%EC%A0%95&feed=rss2"
    mode: "rss"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Esquire Korea"
    url: "https://www.esquirekorea.co.kr/search"
    mode: "hll_search"
    scope: "keyword_search"
    type_hint: "interview"
  - name: "Cosmopolitan Korea"
    url: "https://www.cosmopolitan.co.kr/search"
    mode: "hll_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Allure Korea"
    url: "https://www.allurekorea.com/wp-admin/admin-ajax.php"
    mode: "wp_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Singles"
    url: "https://www.singleskorea.com/api/article-search"
    mode: "singles_search"
    scope: "keyword_search"
    type_hint: "pictorial"
  - name: "Arena"
    url: "https://www.arenakorea.com/rss/allArticle.xml"
    mode: "rss"
    scope: "recent_feed"
    type_hint: "pictorial"
  - name: "Noblesse"
    url: "https://noblesse.com/feed/"
    mode: "rss"
    scope: "recent_feed"
    type_hint: "pictorial"
