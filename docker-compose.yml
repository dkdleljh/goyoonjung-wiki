services:
  wiki:
    build: .
    ports:
      - '8000:8000'
    volumes:
      - ./data:/app/data:ro
      - ./news:/app/news:ro
      - ./pages:/app/pages:ro
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/healthz]
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    build: .
    profiles: [automation]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./news:/app/news
      - ./pages:/app/pages
      - ./sources:/app/sources
      - ./config:/app/config
    environment:
      COLLECT_ONLY: '1'
      TZ: Asia/Seoul
    command: [bash, -c, 'while true; do timeout 2400 bash scripts/run_daily_update.sh; sleep 21600; done']
    healthcheck:
      disable: true
    restart: unless-stopped
